<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiero | Analysis Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    :root {
      /* Theme Transitions */
      --transition-speed: 0.3s;

      /* Colors - DARK (Default) */
      --bg-color: #05070A;
      --nav-bg: rgba(5, 7, 10, 0.75);
      --card-bg: rgba(13, 17, 24, 0.75);
      --card-hover: rgba(20, 26, 38, 0.9);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --primary-accent: #00e676;
      --primary-accent-glow: rgba(0, 230, 118, 0.25);
      --nav-active-bg: rgba(0, 230, 118, 0.15);
      --nav-active-text: #00e676;
      --glow-top: rgba(0, 230, 118, 0.1);
      --glow-bottom: rgba(99, 102, 241, 0.06);
      --font-sans: 'Inter', sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #F8FAFC;
      --nav-bg: rgba(248, 250, 252, 0.8);
      --card-bg: #ffffff;
      --card-hover: #fcfcfc;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --primary-accent: #1D9E75;
      --primary-accent-glow: rgba(29, 158, 117, 0.1);
      --nav-active-bg: #E1F5EE;
      --nav-active-text: #0F6E56;
      --glow-top: rgba(29, 158, 117, 0.08);
      --glow-bottom: rgba(127, 119, 221, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      font-family: var(--font-sans);
    }

    p, span, div {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    /* Option 2: Background Glows */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse, var(--glow-top) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: background var(--transition-speed);
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse, var(--glow-bottom) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: background var(--transition-speed);
    }

    /* --- NAVBAR REFINEMENT --- */
    .nav-header {
      padding: 12px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: background var(--transition-speed), border-color var(--transition-speed);
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .app-logo-box {
      width: 42px;
      height: 42px;
      background: rgba(29, 158, 117, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(29, 158, 117, 0.2);
    }

    .app-logo-box img {
      height: 28px;
      width: 28px;
    }

    .app-brand span {
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .nav-menu {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-btn {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-muted);
      transition: all 0.2s ease;
      font-weight: 500;
      font-size: 13.5px;
    }

    .nav-btn i {
      font-size: 1rem;
      font-weight: 600;
    }

    .nav-btn span {
      font-size: 0.85rem;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active {
      background: var(--primary-accent);
      color: #000;
      font-weight: 700;
      box-shadow: 0 0 15px var(--primary-accent-glow);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .download-report-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.2s ease;
    }
    .download-report-btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: var(--primary-accent);
      color: var(--primary-accent);
    }
    .download-report-btn i { font-size: 0.95rem; }

    /* Theme Toggle */
    .theme-toggle {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary-accent);
      color: var(--primary-accent);
      background: var(--nav-active-bg);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* --- LAYOUT --- */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    .breadcrumb {
      display: flex;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 12px;
      align-items: center;
    }

    .breadcrumb i {
      font-size: 0.65rem;
      opacity: 0.5;
    }

    /* Heading Style Option 2 */
    .page-title {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .page-title span {
      color: var(--primary-accent);
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      max-width: 450px;
    }

    .role-tag {
      display: inline-block;
      padding: 4px 12px;
      background: var(--nav-active-bg);
      color: var(--primary-accent);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* --- GRID & CARDS --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      height: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Grid Spanning for Perfect Alignment */
    .card-score { grid-column: span 4; }
    .card-details { grid-column: span 4; }
    .card-skills { grid-column: span 4; }
    .card-projects { grid-column: span 6; }
    .card-learning { grid-column: span 6; }
    .card-interview { grid-column: span 6; }
    .card-fixes { grid-column: span 6; }

    .card:hover {
      border-color: rgba(0, 230, 118, 0.4);
      background: var(--card-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 230, 118, 0.15);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Score Ring Refinement */
    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 10px;
    }

    .score-svg-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 8px;
    }

    .score-svg-wrapper svg {
      transform: rotate(-90deg);
      width: 100px;
      height: 100px;
    }

    .score-svg-wrapper circle {
      fill: none;
      stroke-width: 8;
    }

    .score-svg-wrapper .bg {
      stroke: var(--border-color);
    }

    .score-svg-wrapper .progress {
      stroke: var(--primary-accent);
      stroke-linecap: round;
      stroke-dasharray: 251.3; 
      stroke-dashoffset: 251.3;
      animation: fillRing 1.5s ease-out forwards;
      animation-delay: 0.5s;
    }

    @keyframes fillRing {
      from { stroke-dashoffset: 251.3; }
      to { stroke-dashoffset: var(--target-offset); }
    }

    .score-val {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.4rem;
      font-weight: 800;
    }

    .score-meta {
      width: 100%;
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
    }

    .percentile-text {
      color: var(--primary-accent);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .mini-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border-color);
      border-radius: 100px;
      overflow: hidden;
    }

    .mini-bar-fill {
      height: 100%;
      background: var(--primary-accent);
      width: 0%;
      transition: width 1.5s ease;
    }

    /* Details Grid */
    .details-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-num {
      font-size: 1.4rem;
      font-weight: 800;
    }

    /* Ratio bar for Analysis details */
    .ratio-container {
      grid-column: span 2;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ratio-bar-bg {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.06);
      margin: 12px 0;
      overflow: hidden;
      display: flex;
    }

    .ratio-fill-matched { height: 100%; background: #1D9E75; width: 0%; transition: width 1s ease; border-radius: 3px; }
    .ratio-fill-missing { height: 100%; background: #D85A30; width: 0%; transition: width 1s ease; border-radius: 3px; }

    /* Skills List Style (Fixing Truncation) */
    .skills-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 280px;
      flex: 1;
      padding-right: 4px;
    }

    /* Custom Scrollbar for Skills */
    .skills-stack::-webkit-scrollbar {
      width: 4px;
    }
    .skills-stack::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
    }
    .skills-stack::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    .skill-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    [data-theme="light"] .skill-list-item {
      background: rgba(0, 0, 0, 0.02);
    }

    .skill-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-matched { background: #1D9E75; box-shadow: 0 0 8px rgba(29, 158, 117, 0.4); }
    .dot-missing { background: #D85A30; box-shadow: 0 0 8px rgba(216, 90, 48, 0.4); }
    .dot-bonus   { background: #7F77DD; box-shadow: 0 0 8px rgba(127, 119, 221, 0.4); }

    .skill-legend {
      display: flex;
      gap: 16px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 0.5px solid rgba(255,255,255,0.06);
    }

    .legend-bit {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .legend-matched { color: #1D9E75; }
    .legend-missing { color: #D85A30; }
    .legend-bonus   { color: #7F77DD; }

    /* Project Cards */
    .project-card {
      display: flex;
      gap: 16px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }

    .project-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--primary-accent);
      transform: translateX(4px);
    }

    .proj-icon {
      width: 42px;
      height: 42px;
      background: var(--nav-active-bg);
      color: var(--primary-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }

    .proj-text h4 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .proj-text p { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    /* Learning Path - Filling gaps */
    .l-path {
      flex: 1;
    }

    .path-row {
      display: flex;
      gap: 20px;
      padding-bottom: 16px;
      position: relative;
    }

    .path-row::before {
      content: '';
      position: absolute;
      left: 17px;
      top: 36px;
      bottom: 0;
      width: 1px;
      background: var(--border-color);
    }

    .path-row:last-child::before { display: none; }

    .path-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-muted);
      flex-shrink: 0;
      z-index: 1;
      transition: all 0.3s;
    }

    .path-row.top-priority .path-num {
      background: var(--primary-accent);
      color: black;
      border-color: var(--primary-accent);
      box-shadow: 0 0 15px var(--primary-accent-glow);
    }

    .path-info {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .path-name { font-weight: 700; font-size: 1.05rem; }
    .path-tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    .priority-tag { background: var(--nav-active-bg); color: var(--primary-accent); }

    /* Mock Interview - Fill top space */
    .mock-intro {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 2px;
    }

    .question-preview {
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .interview-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 14px 0;
    }

    .i-stat {
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .i-val {
      font-size: 20px;
      font-weight: 500;
      color: #fff;
      display: block;
    }

    .i-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
      text-transform: capitalize;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--primary-accent);
      border: none;
      color: black;
    }

    .btn-primary:hover {
      background: #14805e;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px var(--primary-accent-glow);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--primary-accent);
      background: var(--nav-active-bg);
    }

    .action-row {
      display: flex;
      gap: 16px;
      margin-top: 64px;
      justify-content: center;
    }

    .action-btn {
      width: auto;
      padding: 12px 28px;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 1024px) {
      .card-score, .card-details, .card-skills, 
      .card-projects, .card-learning, 
      .card-interview, .card-fixes { 
        grid-column: span 12; 
      }
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .nav-menu { display: none; }
      .nav-header { padding: 12px 20px; }
      .container { padding: 24px 20px; }
      .page-title { font-size: 2rem; }
    }
  
    
    /* --- HIGH-FIDELITY MOCKUP UI ADDITIONS --- */
    :root {
      --card-bg-solid: #0d1117;
      --card-border: rgba(255, 255, 255, 0.08);
      --c-green: #00e676;
      --c-green-bg: rgba(0, 230, 118, 0.1);
      --c-orange: #f59e0b;
      --c-orange-bg: rgba(245, 158, 11, 0.1);
      --c-purple: #8b5cf6;
      --c-purple-bg: rgba(139, 92, 246, 0.1);
      --c-red: #ef4444;
      --c-blue: #3b82f6;
    }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
    .card { background: var(--card-bg-solid); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .card-title { font-size: 1.1rem; font-weight: 600; color: #fff; }
    
    /* Hero Card (Span 7) */
    .card-hero { grid-column: span 7; display: flex; gap: 30px; align-items: center; }
    .hero-ring-container { flex-shrink: 0; text-align: center; position: relative; }
    .hero-ring-container svg { width: 140px; height: 140px; transform: rotate(-90deg); }
    .hero-ring-container svg circle { fill: none; stroke-width: 10; stroke-linecap: round; }
    .hero-ring-bg { stroke: rgba(255,255,255,0.05); }
    .hero-ring-fill { stroke: var(--c-green); stroke-dasharray: 439; stroke-dashoffset: 439; transition: stroke-dashoffset 1.5s ease; }
    .hero-score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; font-weight: 800; color: #fff; }
    
    .hero-content { flex-grow: 1; }
    .hero-badge { display: inline-block; background: var(--c-green-bg); color: var(--c-green); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-left: 10px; }
    .hero-title { font-size: 1.8rem; font-weight: 700; color: var(--c-green); margin-bottom: 5px; display: flex; align-items: center; }
    .hero-desc { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    
    .hero-stats { display: flex; gap: 30px; }
    .hero-stat { display: flex; flex-direction: column; gap: 5px; }
    .hero-stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .hero-stat-val { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .hero-stat-sub { font-size: 0.75rem; font-weight: 600; }

    /* Why this Score (Span 5) */

  <script>
    // --- THEME ENGINE ---
    window.toggleTheme = () => {
      const doc = document.documentElement;
      const current = doc.getAttribute('data-theme');
      const target = current === 'light' ? 'dark' : 'light';
      doc.setAttribute('data-theme', target);
      localStorage.setItem('hiero-theme', target);
      updateThemeUI(target);
    };

    function updateThemeUI(theme) {
      const btn = document.getElementById('theme-switch');
      if (!btn) return;
      if (theme === 'light') {
        btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
      } else {
        btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
      }
    }

    const savedTheme = localStorage.getItem('hiero-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeUI(savedTheme);

    // --- UTILITIES ---
    function sanitize(str) {
      const div = document.createElement('div');
      div.textContent = String(str || '');
      return div.innerHTML;
    }

    // --- WEIGHTED SCORE ENGINE ---
    function computeWeightedScore(data) {
      const jd = data.jdSkills || [];
      const matched = data.matchedSkills || [];
      const extra = data.extraSkills || [];
      const hasExp = (data.experience || []).length > 0 || data.summary;
      const hasEdu = (data.education || []).length > 0;
      const hasProjects = (data.projectSuggestions || []).length > 0 || (data.projects || []).length > 0;

      const jdCount = Math.max(jd.length, 1);
      const skillsPts = Math.round((Math.min(matched.length, jdCount) / jdCount) * 40);
      const projPts = hasProjects ? Math.round(22 + Math.min(extra.length, 3)) : 12;
      const expPts = hasExp ? 13 : 7;
      const eduPts = hasEdu ? 9 : 6;
      const bonusPts = Math.min(10, Math.round(extra.length * 1.5));

      // Use backend score if provided, else compute
      const backendScore = data.score ? Math.round(data.score) : 0;
      const computedScore = skillsPts + projPts + expPts + eduPts + bonusPts;
      const finalScore = backendScore > 0 ? backendScore : Math.min(computedScore, 100);

      return { skillsPts, projPts, expPts, eduPts, bonusPts, finalScore };
    }

    // --- IMPORTANCE TIER ASSIGNMENT ---
    function getImportanceTiers(jdSkills, matchedSkills) {
      // Heuristic: first third = critical, second third = important, rest = nice-to-have
      const n = jdSkills.length;
      const critical = jdSkills.slice(0, Math.ceil(n / 3));
      const important = jdSkills.slice(Math.ceil(n / 3), Math.ceil((2 * n) / 3));
      const niceToHave = jdSkills.slice(Math.ceil((2 * n) / 3));
      const matched = new Set(matchedSkills.map(s => s.toLowerCase().trim()));
      const isMatch = s => matched.has(s.toLowerCase().trim());
      return { critical, important, niceToHave, isMatch };
    }

    // --- INTERVIEW PROBABILITY ---
    function computeInterviewProb(finalScore, atsScore, missingCritical) {
      let base = Math.round((finalScore * 0.5) + (atsScore * 0.3) + 20);
      if (missingCritical > 0) base -= missingCritical * 5;
      return Math.min(Math.max(base, 30), 98);

      // --- PREPARE SKILLS ---
      const uniqueMatched = [...new Set((data.matchedSkills || []).map(s => s.trim()))];
      if (uniqueMatched.length === 0) uniqueMatched.push('Python', 'Machine Learning', 'Data Science', 'REST APIs', 'JavaScript', 'React');

      const uniqueMissing = [...new Set((data.missingSkills || []).map(s => s.trim()))].filter(s => !uniqueMatched.map(m => m.toLowerCase()).includes(s.toLowerCase()));
      if (uniqueMissing.length === 0) uniqueMissing.push('Cloud Computing', 'Agile / Scrum');

      const extraSkills = [...new Set((data.extraSkills || []).map(s => s.trim()))];
      if (extraSkills.length === 0) extraSkills.push('Node.js', 'Express.js', 'Flask', 'PyTorch', 'LLMs', 'JWT');

      const jdSkills = data.jdSkills || [...uniqueMatched.slice(0, 4), ...uniqueMissing.slice(0, 2)];
      const { critical, important, niceToHave, isMatch } = getImportanceTiers(jdSkills, uniqueMatched);

      // --- ATS SCORE (use backend or compute) ---
      const atsScore = data.atsScore || Math.min(100, Math.round(finalScore * 0.95 + 5));
      const atsKeywords = data.atsKeywords || 93;
      const atsFormatting = data.atsFormatting || 100;
      const atsReadability = data.atsReadability || 96;
      const atsStructure = data.atsStructure || 90;
      const atsActionVerbs = data.atsActionVerbs || 88;

      // --- INTERVIEW PROBABILITY ---
      const missingCritical = critical.filter(s => !isMatch(s)).length;
      const interviewChance = computeInterviewProb(finalScore, atsScore, missingCritical);
      const ppoReadiness = Math.round(interviewChance * 0.97);
      const profileStrength = Math.round((finalScore + atsScore) / 2);

      const topMissing2 = uniqueMissing[1] || 'Agile/Scrum';

      else if (finalScore < 60) { recommTitle = 'Developing Candidate'; recommBadge = 'Needs Work'; recommBadgeColor = 'var(--c-orange)'; }

                <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">Strong AI projects, relevant internship, and solid technical stack. Improve <strong style="color:#fff;">${sanitize(topMissing)}</strong> and <strong style="color:#fff;">${sanitize(topMissing2)}</strong> to increase your chances further.</div>

              <div style="text-align:center;">
                <div style="font-size:2rem; font-weight:800; color:#fff;">${interviewChance}%</div>
                <div style="font-size:0.75rem; color:var(--text-muted);">Interview Chance</div>
                <div style="font-size:0.7rem; color:var(--c-green); font-weight:600;">🟢 High</div>
              </div>
              <div style="text-align:center;">
                <div style="font-size:2rem; font-weight:800; color:#fff;">${ppoReadiness}%</div>

                <div style="font-size:0.7rem; color:var(--c-green); font-weight:600;">🟢 High</div>

            <div class="hero-title">${recommTitle} <span class="hero-badge">${recommBadge}</span></div>
            <p class="hero-desc">
              Strong fit for this role. Your experience aligns well with the job requirements. Adding <strong>${sanitize(topMissing)}</strong> and <strong>${sanitize(topMissing2)}</strong> knowledge could increase your score to <strong>${potentialScore}%</strong>.
            </p>
            <div class="hero-stats">
              <div class="hero-stat">
                <span class="hero-stat-lbl">Interview Chance</span>
                <span class="hero-stat-val">${interviewChance}%</span>
                <span class="hero-stat-sub" style="color: var(--c-green)">High Probability</span>
              </div>
              <div class="hero-stat">
                <span class="hero-stat-lbl">PPO Readiness</span>
                <span class="hero-stat-val">${ppoReadiness}%</span>
                <span class="hero-stat-sub" style="color: var(--c-green)">High Probability</span>
              </div>
              <div class="hero-stat">
                <span class="hero-stat-lbl">Profile Strength</span>
                <span class="hero-stat-val">${profileStrength}%</span>
                <span class="hero-stat-sub" style="color: ${profileStrength >= 75 ? 'var(--c-green)' : 'var(--c-orange)'};">Good</span>
              </div>
            </div>
          </div>
        </div>

        <div class="card card-why">
          <div class="card-header"><i class="fa-solid fa-scale-balanced" style="color:var(--c-green)"></i><span class="card-title">Why This Score?</span></div>
          <div class="score-row"><div class="score-row-lbl">Skills Match (40%)</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: ${(skillsPts/40)*100}%;"></div></div><div class="score-row-val">+${skillsPts}/40</div></div>
          <div class="score-row"><div class="score-row-lbl">Project Relevance (25%)</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: ${(projPts/25)*100}%;"></div></div><div class="score-row-val">+${projPts}/25</div></div>
          <div class="score-row"><div class="score-row-lbl">Experience (15%)</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: ${(expPts/15)*100}%;"></div></div><div class="score-row-val">+${expPts}/15</div></div>
          <div class="score-row"><div class="score-row-lbl">Education (10%)</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: ${(eduPts/10)*100}%;"></div></div><div class="score-row-val">+${eduPts}/10</div></div>
          <div class="score-row"><div class="score-row-lbl">Bonus Skills (10%)</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: ${(bonusPts/10)*100}%;"></div></div><div class="score-row-val">+${bonusPts}/10</div></div>
          <div class="score-total"><span>Final Score</span><span style="color: var(--c-green)">${skillsPts + projPts + expPts + eduPts + bonusPts}/100</span></div>
        </div>

        <!-- ROW 2: Match Overview + ATS + Resume Strength -->
        <div class="card card-match-ov">
          <div class="card-header"><i class="fa-solid fa-puzzle-piece" style="color:var(--c-green)"></i><span class="card-title">Match Overview</span></div>
          <div class="mo-stats">
            <div class="mo-stat"><div class="mo-stat-lbl">Matched Skills</div><div class="mo-stat-val"><span style="color:var(--c-green)">${uniqueMatched.length}</span> / ${jdSkills.length}</div></div>
            <div class="mo-stat"><div class="mo-stat-lbl">Resume Coverage</div><div class="mo-stat-val">${Math.round((uniqueMatched.length / Math.max(jdSkills.length, 1)) * 100)}%</div></div>
            <div class="mo-stat"><div class="mo-stat-lbl">Overall Match</div><div class="mo-stat-val">${finalScore}%</div></div>
          </div>
          <div class="mo-bar-bg"><div class="mo-bar-fill" style="width: ${Math.round((uniqueMatched.length / Math.max(jdSkills.length, 1)) * 100)}%"></div></div>
          <div class="mo-footer"><i class="fa-solid fa-star" style="color:var(--c-orange)"></i> You meet ${Math.round((uniqueMatched.length / Math.max(jdSkills.length, 1)) * 100)}% of the key requirements of this role.</div>
        </div>

        <div class="card card-ats">
          <div class="card-header"><i class="fa-regular fa-circle" style="color:var(--c-blue)"></i><span class="card-title">ATS Score</span></div>
          <div class="ats-content">
            <div class="ats-ring">
              <svg><circle class="ats-ring-bg" cx="40" cy="40" r="35"></circle><circle class="ats-ring-fill" cx="40" cy="40" r="35" style="stroke-dasharray:220; stroke-dashoffset: ${220 - (atsScore / 100) * 220};"></circle></svg>
              <div class="ats-val"><div class="ats-val-num">${atsScore}</div><div class="ats-val-sub">/100</div></div>
            </div>
            <div class="ats-checks">
              <div class="ats-check"><span><i class="fa-solid fa-circle-check"></i> Keywords</span><span class="ats-check-val">${atsKeywords}%</span></div>
              <div class="ats-check"><span><i class="fa-solid fa-circle-check"></i> Formatting</span><span class="ats-check-val">${atsFormatting}%</span></div>
              <div class="ats-check"><span><i class="fa-solid fa-circle-check"></i> Readability</span><span class="ats-check-val">${atsReadability}%</span></div>
              <div class="ats-check"><span><i class="fa-solid fa-circle-check"></i> Structure</span><span class="ats-check-val">${atsStructure}%</span></div>
              <div class="ats-check"><span><i class="fa-solid ${atsActionVerbs >= 85 ? 'fa-circle-check' : 'fa-triangle-exclamation'}" style="color:${atsActionVerbs >= 85 ? 'var(--c-green)' : 'var(--c-orange)'}"></i> Action Verbs</span><span class="ats-check-val" style="color:${atsActionVerbs >= 85 ? 'var(--c-green)' : 'var(--c-orange)'}">${atsActionVerbs}%</span></div>
            </div>
          </div>
          <div style="text-align:center; margin-top:-10px;"><span class="ats-status">${atsScore >= 90 ? 'Excellent' : atsScore >= 75 ? 'Good' : 'Needs Work'}</span></div>
          ${atsActionVerbs < 85 ? '<div style="margin-top:10px; font-size:0.75rem; color:var(--c-orange); background:rgba(245,158,11,0.08); border-radius:8px; padding:8px 12px;"><i class="fa-solid fa-triangle-exclamation"></i> ⚠ Missing measurable achievements — add numbers to your bullet points.</div>' : ''}
        </div>

        <div class="card card-strength">
          <div class="card-header"><i class="fa-solid fa-chart-bar" style="color:var(--c-purple)"></i><span class="card-title">Resume Strength Meter</span></div>
          <div class="score-row"><div class="score-row-lbl">Technical Skills</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: 95%;"></div></div><div class="score-row-val">95%</div></div>
          <div class="score-row"><div class="score-row-lbl">Projects</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: 90%;"></div></div><div class="score-row-val">90%</div></div>
          <div class="score-row"><div class="score-row-lbl">Experience</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: 80%; background: #a3e635;"></div></div><div class="score-row-val">80%</div></div>
          <div class="score-row"><div class="score-row-lbl">Achievements</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: 65%; background: var(--c-orange);"></div></div><div class="score-row-val">65%</div></div>
          <div class="score-row"><div class="score-row-lbl">Education</div><div class="score-row-bar-bg"><div class="score-row-bar-fill" style="width: 90%;"></div></div><div class="score-row-val">90%</div></div>
          <div style="margin-top:15px; font-size:0.75rem; color:var(--c-orange); background:rgba(245,158,11,0.07); padding:8px 12px; border-radius:8px;"><i class="fa-solid fa-lightbulb"></i> Achievements is your lowest area — add metrics like "25% improvement", "500+ users".</div>
        </div>

        <!-- ROW 3: Skill Pills -->
        <div class="card card-pill-box">
          <div class="card-header"><i class="fa-solid fa-circle-check" style="color:var(--c-green)"></i><span class="card-title">🟢 Matched Skills (${uniqueMatched.length})</span></div>
          <div class="pill-container">
            ${uniqueMatched.map(s => `<div class="skill-pill pill-green" title="You have this skill — it matches the JD" onclick="void(0)">✅ ${sanitize(s)}</div>`).join('')}
          </div>
          <div class="pill-footer">These skills directly match the job description requirements</div>
        </div>

        <div class="card card-pill-box">
          <div class="card-header"><i class="fa-solid fa-circle-xmark" style="color:var(--c-orange)"></i><span class="card-title">🟠 Missing Skills (${uniqueMissing.length})</span></div>
          <div class="pill-container">
            ${uniqueMissing.map(s => `<div class="skill-pill pill-orange" title="Click to learn this skill" style="cursor:pointer;" onclick="window.location.href='learn.html?skill=${encodeURIComponent(s)}'">❌ ${sanitize(s)}</div>`).join('')}
          </div>
          <div class="pill-footer">Click any skill to open the learning track for it</div>
        </div>

        <div class="card card-pill-box">
          <div class="card-header"><i class="fa-solid fa-arrow-trend-up" style="color:var(--c-purple)"></i><span class="card-title">🟣 Extra Skills (${extraSkills.length})</span></div>
          <div class="pill-container">
            ${extraSkills.map(s => `<div class="skill-pill pill-purple" title="Bonus skill you bring to the table">⭐ ${sanitize(s)}</div>`).join('')}
          </div>
          <div class="pill-footer">Bonus skills that give you an edge over other candidates</div>
        </div>

        <!-- ROW 4: JD Skills by Importance + Missing Keywords -->
        <div class="card card-jd">
          <div class="card-header"><i class="fa-solid fa-layer-group" style="color:var(--c-green)"></i><span class="card-title">Job Description Skills by Importance</span></div>
          <div class="jd-grid">
            <div class="jd-col">
              <h5 style="color: var(--c-red)"><i class="fa-solid fa-circle-dot" style="font-size:0.7rem"></i> Critical</h5>
              <ul class="jd-list">
                ${critical.length > 0 ? critical.map(s => `<li class="jd-item"><i class="fa-solid ${isMatch(s) ? 'fa-check jd-icon-check' : 'fa-xmark jd-icon-cross'}"></i>${sanitize(s)}</li>`).join('') : '<li class="jd-item" style="color:var(--text-muted)">—</li>'}
              </ul>
            </div>
            <div class="jd-col">
              <h5 style="color: var(--c-orange)"><i class="fa-solid fa-circle-dot" style="font-size:0.7rem"></i> Important</h5>
              <ul class="jd-list">
                ${important.length > 0 ? important.map(s => `<li class="jd-item"><i class="fa-solid ${isMatch(s) ? 'fa-check jd-icon-check' : 'fa-xmark jd-icon-cross'}"></i>${sanitize(s)}</li>`).join('') : '<li class="jd-item" style="color:var(--text-muted)">—</li>'}
              </ul>
            </div>
            <div class="jd-col">
              <h5 style="color: var(--c-blue)"><i class="fa-solid fa-circle-dot" style="font-size:0.7rem"></i> Optional / Nice to Have</h5>
              <ul class="jd-list">
                ${niceToHave.length > 0 ? niceToHave.map(s => `<li class="jd-item"><i class="fa-solid ${isMatch(s) ? 'fa-check jd-icon-check' : 'fa-minus jd-icon-dash'}"></i>${sanitize(s)}</li>`).join('') : '<li class="jd-item" style="color:var(--text-muted)">—</li>'}
              </ul>
            </div>
          </div>
          <div class="jd-footer">
            <span>${jdSkills.length} Total JD Skills</span>
            <span style="color:var(--c-green)"><i class="fa-solid fa-circle" style="font-size:6px; vertical-align:middle;"></i> ${uniqueMatched.length} Matched</span>
            <span style="color:var(--c-red)"><i class="fa-solid fa-circle" style="font-size:6px; vertical-align:middle;"></i> ${uniqueMissing.length} Missing</span>
          </div>
        </div>

        <div class="card card-keywords" style="display:flex; flex-direction:column;">
          <div class="card-header"><i class="fa-solid fa-magnifying-glass" style="color:var(--c-purple)"></i><span class="card-title">Top Missing Keywords</span></div>
          <div class="kw-list">
            ${topKeywords.map((kw, i) => `
              <div class="kw-row">
                <div class="kw-left"><div class="kw-num">${i + 1}</div>${sanitize(kw)}</div>
                <button class="kw-add-btn" onclick="window.location.href='resume-builder.html?highlight=skills'" title="Add ${sanitize(kw)} to your resume skills section">+ Add to Resume</button>
              </div>
            `).join('')}
          </div>
          <div class="view-link" style="margin-top:auto;">View All Keywords <i class="fa-solid fa-arrow-right"></i></div>
        </div>

        <!-- ROW 5: Recommended Projects + Learning Track -->
        <div class="card card-projects">
          <div class="card-header"><i class="fa-regular fa-clipboard" style="color:var(--c-green)"></i><span class="card-title">Recommended Projects</span></div>
          ${uniqueMissing.slice(0, 3).map((skill, i) => {
            const icons = ['fa-cloud', 'fa-ship', 'fa-share-nodes'];
            const colors = ['var(--c-blue)', 'var(--c-purple)', 'var(--c-green)'];
            const bgs = ['rgba(59,130,246,0.1)', 'var(--c-purple-bg)', 'var(--c-green-bg)'];
            const projects = {
              'Cloud Computing': { title: 'Deploy ML Model on AWS', tags: ['AWS', 'EC2', 'S3', 'SageMaker'] },
              'Agile / Scrum': { title: 'Agile Sprint Board App', tags: ['Scrum', 'Jira', 'Kanban', 'Retrospectives'] },
              'Docker': { title: 'Containerized ML Pipeline', tags: ['Docker', 'MLflow', 'Flask', 'CI/CD'] },
              'SQL': { title: 'Analytics Dashboard with SQL', tags: ['MySQL', 'PostgreSQL', 'Pandas', 'Charts'] },
            };
            const proj = projects[skill] || { title: `${skill} Hands-On Project`, tags: [skill, 'Portfolio', 'GitHub'] };
            return `
              <div class="proj-row" onclick="void(0)">
                <div class="proj-icon-box" style="color:${colors[i % colors.length]}; background:${bgs[i % bgs.length]};"><i class="fa-solid ${icons[i % icons.length]}"></i></div>
                <div class="proj-content">
                  <h4>${sanitize(proj.title)} <span class="proj-badge" style="${i === 0 ? '' : 'color:var(--c-orange);background:var(--c-orange-bg);'}">${i === 0 ? 'High Impact' : 'Recommended'}</span></h4>
                  <p class="proj-desc">Recommended because you are missing <strong>${sanitize(skill)}</strong>. Build this project to directly address that skill gap and add it to your portfolio.</p>
                  <div class="proj-tags">${proj.tags.map(t => `<span class="proj-tag">${sanitize(t)}</span>`).join('')}</div>
                </div>
              </div>
            `;
          }).join('')}
          <div class="view-link" style="text-align:left; margin-top:15px;">View More Project Ideas <i class="fa-solid fa-arrow-right"></i></div>
        </div>

        <div class="card card-learning">
          <div class="card-header"><i class="fa-solid fa-arrow-trend-up" style="color:var(--c-green)"></i><span class="card-title">Learning Track & Progress</span></div>
          <div class="lrn-list">
            ${[...uniqueMatched.slice(0, 2).map((s, i) => ({ name: s, pct: [80, 70][i] || 70, priority: 'High' })), ...uniqueMissing.slice(0, 3).map((s, i) => ({ name: s, pct: [30, 10, 0][i] ?? 0, priority: i === 0 ? 'High' : 'Medium' }))].map((item, i) => `
              <div class="lrn-row">
                <div class="lrn-left"><div class="lrn-num">${i + 1}</div><div class="lrn-name">${sanitize(item.name)}</div></div>
                <div class="lrn-bar-box">
                  <div class="lrn-bar-bg"><div class="lrn-bar-fill" style="width:${item.pct}%; background:${item.pct > 50 ? 'var(--c-green)' : item.pct > 0 ? 'var(--c-orange)' : 'transparent'};"></div></div>
                  <div class="lrn-pct">${item.pct}%</div>
                </div>
                <div class="lrn-badge ${item.priority === 'High' ? 'lrn-badge-high' : 'lrn-badge-med'}">${item.priority} Priority</div>
              </div>
            `).join('')}
          </div>
          <div class="view-link" style="text-align:left; margin-top:25px;">View Full Learning Path <i class="fa-solid fa-arrow-right"></i></div>
        </div>

        <!-- ROW 6: Resume Improvements (Before/After) + Recruiter Insights -->
        <div class="card card-fixes">
          <div class="card-header"><i class="fa-regular fa-file-lines" style="color:var(--c-green)"></i><span class="card-title">Resume Improvements (Before & After)</span></div>

          <div style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid rgba(255,255,255,0.05);">
            <div style="font-size:0.8rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px;">Bullet Point Example</div>
            <div style="background:rgba(239,68,68,0.05); border:1px solid rgba(239,68,68,0.2); border-radius:8px; padding:12px 15px; margin-bottom:8px; font-size:0.85rem;">
              <span style="color:var(--c-red); font-weight:600;">❌ Before: </span><span style="color:var(--text-muted);">Built a web application for users.</span>
            </div>
            <div style="background:rgba(0,230,118,0.05); border:1px solid rgba(0,230,118,0.2); border-radius:8px; padding:12px 15px; font-size:0.85rem;">
              <span style="color:var(--c-green); font-weight:600;">✅ After: </span><span style="color:#fff;">Built a React + Node.js web application used by <strong>200+ users</strong>, achieving a <strong>40% faster</strong> load time via code splitting.</span>
            </div>
          </div>

          <div class="fix-row">
            <div class="fix-left">
              <div class="fix-icon"><i class="fa-solid fa-database"></i></div>
              <div class="fix-text"><h4>Add Pandas & NumPy</h4><p>Include in your skills section</p></div>
            </div>
            <div class="fix-mid">Mention: <em>Pandas, NumPy, Matplotlib</em></div>
            <button class="fix-btn" onclick="window.location.href='resume-builder.html?highlight=skills'">Add Now</button>
          </div>
          <div class="fix-row">
            <div class="fix-left">
              <div class="fix-icon"><i class="fa-solid fa-chart-line"></i></div>
              <div class="fix-text"><h4>Quantify Project Results</h4><p>Add numbers to all bullet points</p></div>
            </div>
            <div class="fix-mid">e.g. "Increased accuracy by 25%" or "500+ users"</div>
            <button class="fix-btn" onclick="window.location.href='resume-builder.html'">Improve</button>
          </div>
          <div class="fix-row">
            <div class="fix-left">
              <div class="fix-icon"><i class="fa-solid fa-cloud"></i></div>
              <div class="fix-text"><h4>Add Cloud Experience</h4><p>Even a personal project counts</p></div>
            </div>
            <div class="fix-mid">e.g. "Deployed on AWS EC2, used S3 for storage"</div>
            <button class="fix-btn" onclick="window.location.href='learn.html?skill=Cloud+Computing'">Learn</button>
          </div>
          <div class="fix-row">
            <div class="fix-left">
              <div class="fix-icon"><i class="fa-brands fa-github"></i></div>
              <div class="fix-text"><h4>Add GitHub Links</h4><p>Link all major projects</p></div>
            </div>
            <div class="fix-mid">Include live demo or GitHub repo links</div>
            <button class="fix-btn" onclick="window.location.href='resume-builder.html'">Add Now</button>
          </div>
        </div>

        <div class="card card-recruiter">
          <div class="card-header"><i class="fa-solid fa-list-check" style="color:var(--c-purple)"></i><span class="card-title">Recruiter's Perspective</span></div>
          <div class="rec-split">
            <div class="rec-col">
              <h4 style="color: var(--c-green)">Strengths</h4>
              <ul class="rec-list">
                <li class="rec-item"><i class="fa-solid fa-circle-check rec-icon-check"></i>Excellent AI/ML Project Portfolio</li>
                <li class="rec-item"><i class="fa-solid fa-circle-check rec-icon-check"></i>Strong Backend (Node.js + Python)</li>
                <li class="rec-item"><i class="fa-solid fa-circle-check rec-icon-check"></i>Relevant Internship Experience</li>
                <li class="rec-item"><i class="fa-solid fa-circle-check rec-icon-check"></i>Full Stack Development Skills</li>
                <li class="rec-item"><i class="fa-solid fa-circle-check rec-icon-check"></i>LLM & Speech API Experience</li>
              </ul>
            </div>
            <div class="rec-col">
              <h4 style="color: var(--c-orange)">Concerns</h4>
              <ul class="rec-list">
                <li class="rec-item"><i class="fa-solid fa-triangle-exclamation rec-icon-warn"></i>No SQL mentioned in resume</li>
                <li class="rec-item"><i class="fa-solid fa-triangle-exclamation rec-icon-warn"></i>No Cloud deployment experience</li>
                <li class="rec-item"><i class="fa-solid fa-triangle-exclamation rec-icon-warn"></i>Projects lack measurable metrics</li>
                <li class="rec-item"><i class="fa-solid fa-triangle-exclamation rec-icon-warn"></i>Missing Agile/Scrum exposure</li>
              </ul>
            </div>
          </div>
          <div class="rec-pro-tip">
            <div class="rec-pro-icon"><i class="fa-solid fa-bullseye"></i></div>
            <div class="rec-pro-text">
              <h5>Pro Tip from Recruiter</h5>
              <p>Add SQL, Cloud skills, and quantify your project results (add numbers!) to be among the top 10% of candidates shortlisted for AI/ML roles.</p>
            </div>
            <div class="rec-pro-target"><i class="fa-solid fa-bullseye"></i></div>
          </div>
        </div>

      `;

      // Animate bars after render
      setTimeout(() => {
        document.querySelectorAll('.score-row-bar-fill, .mo-bar-fill, .lrn-bar-fill').forEach(el => {
          el.style.transition = 'width 1.2s ease';
        });
      }, 100);
    }

    document.addEventListener('DOMContentLoaded', renderPage);
  </script>
</body>
</html>
