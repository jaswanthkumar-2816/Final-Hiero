<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiero Eval | Verify a skill</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    :root { --primary:#04ab07; --primary-glow:rgba(4,171,7,.35); --font-sans:'Inter',sans-serif; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body.eval-page,
    body.eval-page h1,
    body.eval-page h2,
    body.eval-page h3,
    body.eval-page p,
    body.eval-page span,
    body.eval-page a,
    body.eval-page button {
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif !important;
      -webkit-font-smoothing:antialiased;
    }
    body.eval-page {
      min-height:100vh;
      color:#102016;
      background-color:#eef8f1;
      background-image:url('hiero-eval-bg.jpg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      background-attachment:fixed;
      font-size:16px;
    }
    body.eval-page::before {
      content:'';
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:rgba(255,255,255,.28);
    }
    html[data-theme="dark"] body.eval-page,
    body.eval-page:not(.light-mode) { color:#f4faf6; }
    html[data-theme="dark"] body.eval-page::before,
    body.eval-page:not(.light-mode)::before { background:rgba(4,10,6,.58); }
    .wrap { position:relative; z-index:1; max-width:1480px; margin:0 auto; padding:22px 36px 28px; min-height:100vh; display:flex; flex-direction:column; }
    #landing { flex:1; display:flex; flex-direction:column; min-height:0; }
    .nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .back, .theme-toggle-btn { color:inherit; text-decoration:none; font-weight:700; font-size:13px; border:1px solid rgba(11,61,28,.14); border-radius:99px; padding:8px 14px; background:rgba(255,255,255,.7); cursor:pointer; }
    html[data-theme="dark"] .back,
    html[data-theme="dark"] .theme-toggle-btn,
    body.eval-page:not(.light-mode) .back,
    body.eval-page:not(.light-mode) .theme-toggle-btn {
      color:#fff; border-color:rgba(255,255,255,.16); background:rgba(8,16,10,.45);
    }
    .hero-copy {
      background:#ffffff;
      border:1px solid rgba(16,80,36,.08);
      border-radius:18px;
      padding:18px 22px 16px;
      margin-bottom:18px;
      box-shadow:0 8px 24px rgba(16,80,36,.06);
    }
    .badge { display:inline-flex; gap:8px; align-items:center; color:#047857; font-weight:800; font-size:12px; letter-spacing:.4px; text-transform:uppercase; }
    h1 { font-size:36px; letter-spacing:-.4px; margin:8px 0 8px; line-height:1.2; color:#102016; }
    h1 span { color:#04850a; }
    .sub { color:#24362c; margin:0; line-height:1.55; max-width:720px; font-size:16px; font-weight:500; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; align-items:stretch; flex:1; min-height:520px; }
    .card {
      background:#ffffff;
      color:#102016;
      border:1px solid rgba(16,80,36,.1);
      border-radius:26px;
      padding:32px 28px;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      gap:16px;
      min-height:100%;
      box-shadow:0 10px 28px rgba(16,80,36,.08);
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover { transform:translateY(-2px); border-color:rgba(4,171,7,.4); }
    .card.selected { border-color:var(--primary); box-shadow:0 0 0 3px rgba(4,171,7,.2), 0 14px 32px rgba(4,171,7,.12); }
    .card.locked { cursor:not-allowed; background:#f3f6f4; }
    .card.locked:hover { transform:none; }
    .card-top { display:flex; justify-content:space-between; align-items:center; }
    .kicker { font-size:12px; font-weight:800; color:#047857; text-transform:uppercase; letter-spacing:.4px; }
    .card.locked .kicker { color:#b45309; }
    .card h3 { font-size:36px; letter-spacing:-.2px; line-height:1.1; color:#102016; }
    .stat-row { display:flex; flex-wrap:wrap; gap:8px; }
    .stat { font-size:13px; font-weight:700; padding:6px 11px; border-radius:999px; background:#e8f8ea; color:#065f46; }
    .topic-row { display:flex; flex-wrap:wrap; gap:8px; }
    .topic-chip { font-size:14px; font-weight:650; padding:8px 12px; border-radius:12px; background:#eef7f0; color:#14532d; }
    .sample {
      margin:0;
      padding:16px 16px;
      border-left:3px solid #04ab07;
      background:#f3faf4;
      border-radius:0 14px 14px 0;
      font-size:16px;
      line-height:1.5;
      color:#1a2a20;
      font-weight:500;
    }
    .sample span { display:block; font-size:11px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#047857; margin-bottom:4px; }
    .note-row { display:flex; flex-direction:column; gap:6px; }
    .history, .coding-note, .safety, .lock-note { font-size:14px; line-height:1.45; margin:0; }
    .history { font-weight:700; color:#065f46; }
    .coding-note { color:#24362c; font-weight:500; }
    .safety { color:#334155; font-weight:500; }
    .lock-note { font-weight:800; color:#b45309; }
    .card-meta { margin-top:auto; padding-top:12px; border-top:1px solid #e2ebe4; }
    .why { font-size:15px; font-weight:700; color:#14532d; line-height:1.45; }
    html[data-theme="dark"] .hero-copy, body.eval-page:not(.light-mode) .hero-copy { background:#121a14; border-color:rgba(255,255,255,.08); }
    html[data-theme="dark"] h1, body.eval-page:not(.light-mode) h1 { color:#ffffff; }
    html[data-theme="dark"] .sub, body.eval-page:not(.light-mode) .sub { color:#e2e8f0; }
    html[data-theme="dark"] .badge, body.eval-page:not(.light-mode) .badge { color:#86efac; }
    html[data-theme="dark"] .card, body.eval-page:not(.light-mode) .card { background:#121a14; color:#f8fafc; border-color:rgba(255,255,255,.1); }
    html[data-theme="dark"] .card.locked, body.eval-page:not(.light-mode) .card.locked { background:#0e1410; }
    html[data-theme="dark"] .card h3, body.eval-page:not(.light-mode) .card h3 { color:#ffffff; }
    html[data-theme="dark"] .kicker, body.eval-page:not(.light-mode) .kicker { color:#86efac; }
    html[data-theme="dark"] .card.locked .kicker, body.eval-page:not(.light-mode) .card.locked .kicker { color:#fbbf24; }
    html[data-theme="dark"] .stat, body.eval-page:not(.light-mode) .stat { background:#1b3a22; color:#bbf7d0; }
    html[data-theme="dark"] .topic-chip, body.eval-page:not(.light-mode) .topic-chip { background:#1a2620; color:#ecfdf5; }
    html[data-theme="dark"] .sample, body.eval-page:not(.light-mode) .sample { background:#16301c; color:#f1f5f9; }
    html[data-theme="dark"] .sample span, body.eval-page:not(.light-mode) .sample span { color:#86efac; }
    html[data-theme="dark"] .history, html[data-theme="dark"] .why, body.eval-page:not(.light-mode) .history, body.eval-page:not(.light-mode) .why { color:#f8fafc; }
    html[data-theme="dark"] .coding-note, html[data-theme="dark"] .safety, body.eval-page:not(.light-mode) .coding-note, body.eval-page:not(.light-mode) .safety { color:#cbd5e1; }
    html[data-theme="dark"] .lock-note, body.eval-page:not(.light-mode) .lock-note { color:#fbbf24; }
    html[data-theme="dark"] .card-meta, body.eval-page:not(.light-mode) .card-meta { border-color:rgba(255,255,255,.12); }
    .btn { display:inline-flex; align-items:center; gap:8px; border:0; border-radius:16px; padding:15px 24px; font-weight:800; cursor:pointer; font-size:16px; }
    .btn-main { background:var(--primary); color:#000; }
    .btn-ghost { background:rgba(255,255,255,.7); color:#0b3d1c; border:1px solid rgba(11,61,28,.12); }
    html[data-theme="dark"] .btn-ghost, body.eval-page:not(.light-mode) .btn-ghost { background:rgba(255,255,255,.06); color:#fff; border-color:rgba(255,255,255,.12); }
    .landing-actions { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
    .status-row { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 18px; }
    .chip { background:rgba(255,255,255,.7); border:1px solid rgba(4,171,7,.25); color:#14532d; border-radius:99px; padding:6px 12px; font-size:12px; font-weight:700; }
    html[data-theme="dark"] .chip, body.eval-page:not(.light-mode) .chip { background:rgba(8,16,10,.5); color:#fff; }
    .chip.warn { border-color:rgba(251,191,36,.45); color:#b45309; }
    html[data-theme="dark"] .chip.warn, body.eval-page:not(.light-mode) .chip.warn { color:#fbbf24; }
    @media (max-width:980px) {
      .wrap { padding:20px 16px 36px; }
      .grid { grid-template-columns:1fr; }
      h1 { font-size:30px; }
    }
  </style>
</head>
<body class="eval-page">
  <div class="wrap">
    <div class="nav">
      <a class="back" id="back-link" href="quiz.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <button class="theme-toggle-btn" id="theme-switch" onclick="window.toggleTheme()" title="Switch Theme"><i class="fa-solid fa-moon"></i></button>
    </div>

    <section id="landing">
      <div class="hero-copy">
        <div class="badge"><i class="fa-solid fa-shield-halved"></i> Hiero Eval · Resume verification</div>
        <h1>Prove you know <span id="skill-name">this skill</span></h1>
        <p class="sub">A pass adds a Verified badge to your resume. A fail never removes the skill — it stays unverified until you pass.</p>
      </div>
      <div class="status-row" id="status-row"></div>
      <div class="grid" id="level-grid"></div>
      <div class="landing-actions">
        <button class="btn btn-main" id="start-btn">Start recommended eval</button>
        <a class="btn btn-ghost" id="learn-link" href="quiz.html">Learn first</a>
      </div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const skill = params.get('skill') || 'Python';
    const track = params.get('track') || 'beginner';
    const userId = localStorage.getItem('userId') || localStorage.getItem('user_id') || 'guest-user';
    let status = null;
    let chosenLevel = 1;

    document.getElementById('skill-name').textContent = skill;
    document.getElementById('learn-link').href = (track === 'intermediate' ? 'learn-intermediate.html' : 'learn-beginner.html') + '?skill=' + encodeURIComponent(skill) + '&track=' + track;
    document.getElementById('back-link').href = document.getElementById('learn-link').href;

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function shortDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function catalogFor(skillName) {
      const s = String(skillName || '').toLowerCase();
      if (s.includes('git')) return {
        1: { topics: ['Basic commands', 'Staging & commits', 'Branching'], sample: 'What does git status show you before a commit?' },
        2: { topics: ['Merging', 'Rebase', 'Remotes', 'Conflicts'], sample: 'What does git rebase do differently from git merge?' },
        3: { topics: ['History rewrite', 'Hooks', 'Recovery', 'Advanced remotes'], sample: 'When is git reflog the safer recovery tool than reset?' }
      };
      if (s.includes('java') || s.includes('oop')) return {
        1: { topics: ['Classes & objects', 'Methods', 'Constructors'], sample: 'What is the difference between a class and an object?' },
        2: { topics: ['Inheritance', 'Polymorphism', 'Encapsulation', 'Interfaces'], sample: 'When should you use an interface instead of a class?' },
        3: { topics: ['Design patterns', 'Exceptions', 'Collections', 'Memory'], sample: 'Which collection fits frequent lookups by key?' }
      };
      if (s.includes('python')) return {
        1: { topics: ['Syntax', 'Variables', 'Functions'], sample: 'What does a Python function return if there is no return statement?' },
        2: { topics: ['Lists & dicts', 'Errors', 'Modules', 'Comprehensions'], sample: 'When is a dictionary a better choice than a list?' },
        3: { topics: ['OOP', 'Decorators', 'Async', 'Testing'], sample: 'What problem do decorators solve in Python?' }
      };
      if (s.includes('javascript') || s.includes('js') || s.includes('node')) return {
        1: { topics: ['Variables', 'Functions', 'DOM basics'], sample: 'What is the difference between let and const?' },
        2: { topics: ['Async', 'Arrays', 'Objects', 'Scope'], sample: 'What does Promise.all wait for before resolving?' },
        3: { topics: ['Closures', 'Event loop', 'Modules', 'Performance'], sample: 'Why can a closure still read a variable after the outer function returns?' }
      };
      if (s.includes('sql') || s.includes('database')) return {
        1: { topics: ['SELECT', 'WHERE', 'JOINs'], sample: 'What does an INNER JOIN keep from both tables?' },
        2: { topics: ['GROUP BY', 'Indexes', 'Keys', 'Subqueries'], sample: 'When does an index speed up a WHERE filter?' },
        3: { topics: ['Transactions', 'Normalization', 'Plans', 'Locks'], sample: 'What does COMMIT do at the end of a transaction?' }
      };
      return {
        1: { topics: ['Core concepts', 'Everyday use', 'Basic syntax'], sample: `Which statement is most accurate about getting started with ${skillName}?` },
        2: { topics: ['Practical patterns', 'Edge cases', 'Debugging'], sample: `When would you choose one ${skillName} approach over another?` },
        3: { topics: ['Architecture', 'Performance', 'Best practices'], sample: `What is the most reliable way to recover from a ${skillName} failure?` }
      };
    }

    function looksGeneric(preview) {
      const topics = (preview.topics || []).join(' ').toLowerCase();
      const sample = String(preview.sample || '').toLowerCase();
      return /core concepts|practical use|edge cases|best practices/.test(topics)
        || /which statement is most accurate/.test(sample);
    }

    function cardCopy(lvl) {
      const catalog = catalogFor(skill);
      const preview = status?.previews?.[lvl] || {};
      const useBank = preview.topics && preview.topics.length >= 2 && !looksGeneric(preview);
      const topics = useBank ? preview.topics.slice(0, 4) : catalog[lvl].topics;
      const sample = (!looksGeneric(preview) && preview.sample) ? preview.sample : catalog[lvl].sample;
      const stats = {
        1: ['3 quiz', '5 min', '70% to pass'],
        2: ['5 quiz', '1 coding', '20 min', '75% to pass'],
        3: ['7 quiz', '3 coding', '45 min', '80% to pass']
      };
      const safety = {
        1: 'Fail stays unverified. Retry anytime.',
        2: 'Fail stays unverified. Coding runs here — no install.',
        3: 'Hardest round. Fail stays unverified. Retry anytime.'
      };
      const why = {
        1: 'Pass and a Level 1 badge appears on your resume.',
        2: 'Pass and your resume badge upgrades to Level 2.',
        3: 'The strongest verified mark this skill can show.'
      };
      return { topics, sample, stats: stats[lvl], safety: safety[lvl], why: why[lvl] };
    }

    function renderLevels() {
      const rec = status?.recommendedLevel || 1;
      const verified = status?.verifiedLevel || 0;
      chosenLevel = rec;
      const grid = document.getElementById('level-grid');
      grid.innerHTML = [1,2,3].map((lvl) => {
        const locked = lvl === 3 && verified < 2 && rec < 3;
        const copy = cardCopy(lvl);
        const hist = status?.levelHistory?.[lvl];
        const history = hist
          ? `Last attempt · ${hist.score}%${hist.passed ? ' passed' : ''} · ${shortDate(hist.submittedAt)}`
          : '';
        const kicker = locked ? 'Locked' : (lvl === rec ? 'Recommended' : (lvl > rec ? 'Challenge up' : 'Easier'));
        return `
        <div class="card ${lvl === rec && !locked ? 'selected' : ''} ${locked ? 'locked' : ''}" data-level="${lvl}">
          <div class="card-top">
            <div class="kicker">${kicker}</div>
            <h3>Level ${lvl}</h3>
          </div>
          <div class="stat-row">${copy.stats.map((s) => `<span class="stat">${s}</span>`).join('')}</div>
          <div class="topic-row">${copy.topics.map((t) => `<span class="topic-chip">${escapeHtml(t)}</span>`).join('')}</div>
          <p class="sample"><span>Sample question</span>${escapeHtml(copy.sample)}</p>
          <div class="note-row">
            ${history ? `<p class="history">${escapeHtml(history)}</p>` : ''}
            ${lvl > 1 ? '<p class="coding-note">Coding runs here in Python. No setup.</p>' : ''}
            <p class="safety">${copy.safety}</p>
            ${locked ? `<p class="lock-note">Unlocks after you pass Level ${lvl - 1}</p>` : ''}
          </div>
          <div class="card-meta">
            <p class="why">${copy.why}</p>
          </div>
        </div>`;
      }).join('');
      grid.querySelectorAll('.card').forEach((card) => {
        card.onclick = () => {
          if (card.classList.contains('locked')) return;
          grid.querySelectorAll('.card').forEach((c) => c.classList.remove('selected'));
          card.classList.add('selected');
          chosenLevel = Number(card.dataset.level);
          document.getElementById('start-btn').textContent = `Start Level ${chosenLevel} eval`;
        };
      });
      document.getElementById('start-btn').textContent = `Start Level ${chosenLevel} eval`;
      const row = document.getElementById('status-row');
      row.innerHTML = '';
      if (status?.verifiedLevel) row.innerHTML += `<span class="chip">Verified — Level ${status.verifiedLevel}${status.evalScore != null ? ' · ' + status.evalScore + '%' : ''}</span>`;
      else row.innerHTML += `<span class="chip warn">Unverified on resume</span>`;
      row.innerHTML += `<span class="chip">Auto level from your path: ${rec}</span>`;
    }

    async function startEval() {
      if (status && status.canStart === false) {
        alert(status.error || 'Could not start eval right now.');
        return;
      }
      const res = await fetch('/api/eval/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId,
          skill,
          level: chosenLevel,
          challengeUp: chosenLevel > (status?.recommendedLevel || 1)
        })
      });
      const json = await res.json();
      if (!json.success) { alert(json.error || 'Could not start eval'); return; }
      sessionStorage.setItem('hieroEvalRound', JSON.stringify({
        skill,
        track,
        userId,
        status,
        chosenLevel,
        attempt: json,
        qIdx: 0,
        answers: Array(json.quiz.length).fill(null),
        codingSubs: [],
        cIdx: 0,
        endsAt: Date.now() + json.timeLimitSec * 1000
      }));
      location.href = 'eval-round.html?skill=' + encodeURIComponent(skill) + '&track=' + encodeURIComponent(track);
    }

    document.getElementById('start-btn').onclick = startEval;

    (async function init() {
      const res = await fetch(`/api/eval/status?userId=${encodeURIComponent(userId)}&skill=${encodeURIComponent(skill)}`);
      status = await res.json();
      renderLevels();
    })();
  </script>
</body>
</html>
