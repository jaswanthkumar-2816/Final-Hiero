<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Skills | Hiero</title>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const track = String(params.get('track') || '').toLowerCase();
      const skill = params.get('skill');

      if (!skill && track !== 'beginner' && track !== 'intermediate') {
        window.location.replace('quiz.html');
          return;
        }

      const page = track === 'intermediate'
        ? 'learn-intermediate.html'
        : 'learn-beginner.html';
      params.set('track', track === 'intermediate' ? 'intermediate' : 'beginner');
      window.location.replace(page + '?' + params.toString());
    })();
  </script>
</head>
<body>
  <p style="font-family: sans-serif; color: #94a3b8; padding: 40px; text-align: center;">
    Opening your learning path…
  </p>
</body>
</html>
