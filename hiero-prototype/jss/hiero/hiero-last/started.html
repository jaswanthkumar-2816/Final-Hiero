<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Hiero</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charter-webfont@4/charter.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Charter, 'Bitstream Charter', Georgia, serif;
    }

    #field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: grab;
    }
    #field:active { cursor: grabbing; }

    .nebula-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(circle at 50% 50%, rgba(50, 193, 74, 0.03) 0%, rgba(50, 193, 74, 0.01) 30%, rgba(0, 0, 0, 0) 65%),
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 62%, rgba(0, 0, 0, 0.55) 100%);
    }

    .logo-aura {
      position: absolute;
      left: 50%;
      top: 32%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80, 230, 110, 0.084) 0%, rgba(50, 193, 74, 0.028) 50%, rgba(0, 0, 0, 0) 72%);
      filter: blur(28px);
      pointer-events: none;
      z-index: 2;
    }

    .welcome {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 20;
      width: min(760px, calc(100% - 32px));
      padding: 72px 20px 40px;
      text-align: center;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.55) 42%, rgba(0, 0, 0, 0.78) 100%);
    }

    .welcome-kicker {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 22;
      font-family: Charter, 'Bitstream Charter', Georgia, serif;
      font-size: clamp(32px, 4.2vw, 48px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      background: linear-gradient(115deg, #ffffff 0%, #d7efc8 32%, #59b03a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.55));
      pointer-events: none;
    }

    .welcome-kicker em {
      font-style: normal;
    }

    .welcome h1 {
      font-family: Charter, 'Bitstream Charter', Georgia, serif;
      font-size: clamp(28px, 4.8vw, 44px);
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.18;
      margin: 0 auto 14px;
      max-width: 18ch;
      text-wrap: balance;
    }

    .welcome-promise {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 18px;
      font-family: Charter, 'Bitstream Charter', Georgia, serif;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(16px, 2.1vw, 20px);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.3;
      margin: 0 auto 26px;
    }

    .welcome-promise span + span::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 18px;
      border-radius: 50%;
      background: #32c14a;
      vertical-align: middle;
      transform: translateY(-1px);
    }

    .welcome-promise span:last-child {
      color: #32c14a;
    }

    .get-started-btn {
      pointer-events: auto;
      appearance: none;
      border: none;
      cursor: pointer;
      color: #04140a;
      background: #32c14a;
      font-family: Charter, 'Bitstream Charter', Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 16px 42px;
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(50, 193, 74, 0.4), 0 10px 36px rgba(50, 193, 74, 0.28);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .get-started-btn:hover {
      background: #4ad45f;
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 0 0 1px rgba(50, 193, 74, 0.55), 0 14px 42px rgba(50, 193, 74, 0.38);
    }
    .get-started-btn:active {
      transform: translateY(0) scale(0.99);
    }

    @media (max-width: 640px) {
      .welcome-kicker { top: 18px; left: 18px; }
      .welcome { padding: 56px 8px 24px; }
      .welcome h1 { max-width: none; }
      .welcome-promise { gap: 8px 14px; }
      .welcome-promise span + span::before { margin-right: 14px; }
      .get-started-btn { width: 100%; }
    }
  </style>
  <script src="lotus_points.js"></script>
</head>
<body>
  <div id="hieroShapeHost" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;"></div>
  <canvas id="field"></canvas>
  <div class="logo-aura"></div>
  <div class="nebula-glow"></div>
  <div class="welcome-kicker">Welcome to <em>Hiero</em></div>

  <div class="welcome">
    <h1>Stop guessing what recruiters want.</h1>
    <p class="welcome-promise">
      <span>Know your gaps</span>
      <span>Close them</span>
      <span>Get hired</span>
    </p>
    <button type="button" class="get-started-btn" onclick="window.location.href='/get-started'">Get Started</button>
  </div>

  <script src="hiero-astra-engine.js"></script>
</body>
</html>
