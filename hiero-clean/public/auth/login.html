<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Hiero</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/4e56cb0e6d.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Splash Screen */
    .splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-animated {
      width: 140px;
      animation: glowPulse 2s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from {
        filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.4));
        transform: scale(1);
      }
      to {
        filter: drop-shadow(0 0 25px rgba(0, 255, 0, 0.8));
        transform: scale(1.05);
      }
    }

    /* Login/Signup Card Container */
    .login-wrapper {
      display: flex;
      width: 100%;
      max-width: 960px;
      min-height: 560px;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 255, 0, 0.15), 0 0 40px rgba(0, 0, 0, 0.8);
      margin: auto;
    }

    /* Left Panel: Glowing Logo */
    .login-left {
      flex: 1;
      background: radial-gradient(circle at center, #051a05 0%, #000000 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glow-logo {
      width: 220px;
      max-width: 80%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(0, 255, 0, 0.6));
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    /* Right Panel: Form Area */
    .login-right {
      flex: 1;
      background: #0e0e0e;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
    }

    .login-box h2 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    /* OAuth Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 50px;
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      margin-bottom: 12px;
    }

    .btn.google-btn {
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a1a;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn.google-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 255, 255, 0.15);
    }

    .btn.github-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn.github-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    /* Divider */
    .divider {
      margin: 18px 0;
      display: flex;
      align-items: center;
      color: rgba(255, 255, 255, 0.4);
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    .divider span {
      padding: 0 14px;
      font-size: 13px;
      font-weight: 500;
    }

    /* Form Inputs */
    #login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    #login-form input {
      width: 100%;
      padding: 13px 20px;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    #login-form input:focus {
      border-color: #00ff00;
      box-shadow: 0 0 12px rgba(0, 255, 0, 0.3);
      background: #1e1e1e;
    }

    #login-form input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .email-btn {
      background-color: #00ff00 !important;
      color: #000000 !important;
      font-weight: 700 !important;
      border: none !important;
      margin-top: 4px;
    }

    .email-btn:hover {
      background-color: #00cc00 !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 255, 0, 0.3);
    }

    .signup-text {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .signup-text a {
      color: #00ff00;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .login-wrapper {
        flex-direction: column;
        max-width: 440px;
      }
      .login-left {
        padding: 30px 20px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glow-logo {
        width: 140px;
      }
      .login-right {
        padding: 36px 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ✅ Splash Screen -->
  <div class="splash-screen" id="splash-screen">
    <img src="logohiero.png" class="logo-animated" alt="Hiero Logo">
  </div>

  <!-- ✅ Main Login Section -->
  <div class="login-wrapper" id="main-content" style="display: none;">
    <!-- Left Side: Glowing Logo -->
    <div class="login-left">
      <img src="logohiero.png" alt="Hiero Logo" class="glow-logo">
    </div>

    <!-- Right Side: Login Form -->
    <div class="login-right">
      <div class="login-box">
        <h2>Welcome Back</h2>
        <p style="color: rgba(255, 255, 255, 0.6); text-align: center; margin-bottom: 24px; font-size: 14.5px;">Login to your Hiero account</p>

        <!-- Social Login -->
        <a href="/auth/google" class="btn google-btn">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </a>
        <a href="/auth/github" class="btn github-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
          </svg>
          Continue with GitHub
        </a>

        <div class="divider">
          <span>or</span>
        </div>

        <!-- Email Form -->
        <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; margin-bottom: 16px; text-align: center; font-weight: 600;"></div>

        <form id="login-form">
          <input type="text" id="email" name="email" placeholder="Email or Username" required>
          <input type="password" id="password" name="password" placeholder="Password" required>
          <button type="submit" id="login-btn" class="btn email-btn">
            Login
          </button>
        </form>

        <p class="signup-text">Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </div>

  <script>
    // ✅ Instant & Reliable Splash Screen Transition
    function showMainContent() {
      const splash = document.getElementById("splash-screen");
      if (splash) splash.style.display = "none";
      const main = document.getElementById("main-content");
      if (main) main.style.display = "flex";
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => setTimeout(showMainContent, 100));
    } else {
      setTimeout(showMainContent, 100);
    }

    // ✅ Login logic
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");
      if (errorBox) errorBox.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        if (errorBox) {
          errorBox.textContent = "Please enter your email/username and password.";
          errorBox.style.display = "block";
        }
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';
      }

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const result = await res.json();

        if (res.ok && (result.success || result.token)) {
          if (result.token) localStorage.setItem("token", result.token);
          if (result.user) localStorage.setItem("user", JSON.stringify(result.user));

          if (btn) btn.innerHTML = '✓ Success! Redirecting...';
          setTimeout(() => {
            window.location.href = "/index.html";
          }, 400);
        } else {
          const errMsg = result.error || result.message || "Login failed. Please check your credentials.";
          if (errorBox) {
            errorBox.textContent = "❌ " + errMsg;
            errorBox.style.display = "block";
          } else {
            alert("❌ " + errMsg);
          }
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Login";
          }
        }
      } catch (err) {
        console.error('Login error:', err);
        if (errorBox) {
          errorBox.textContent = "❌ Network error. Please check your connection and try again.";
          errorBox.style.display = "block";
        } else {
          alert("❌ Network error logging in.");
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Login";
        }
      }
    });
  </script>
</body>

</html>
