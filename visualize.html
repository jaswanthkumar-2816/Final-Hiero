    function triggerConfettiBurst() {
      const canvas = document.getElementById('vis-confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement ? canvas.parentElement.offsetWidth : 600;
      canvas.height = canvas.parentElement ? canvas.parentElement.offsetHeight : 300;

      const colors = ['#00ff66', '#38bdf8', '#fbbf24', '#f43f5e', '#a855f7'];
      const particles = [];
      const PARTICLE_COUNT = 28;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 80,
          y: canvas.height / 2 + (Math.random() - 0.5) * 30,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 6 - 3,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          life: 1.0
        });
      }

      let animId;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = 0;

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.22; // gravity
          p.rotation += p.rotSpeed;
          p.life -= 0.015;

          if (p.life > 0) {
            alive++;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
            ctx.restore();
          }
        }

        if (alive > 0) {
          animId = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animId);
        }
      }

      animate();
    }

    // Keyboard Shortcuts for Theater
    document.addEventListener('keydown', (e) => {
      const theater = document.getElementById('visualizer-theater');
      if (!theater) return;

      if (e.key === 'Escape') {
        closeVisualizer();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        visualizerTogglePlay();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        visualizerStep(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        visualizerStep(-1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        visualizerRestart();
      }
    });

    // Client Fallback if Server Unreachable — walk the student's own lines
    function runClientFallbackVisualizer(code) {
      const theater = document.getElementById('visualizer-theater');
      if (!theater) return;
      populateVisualizerCode(code);
      theater.style.display = 'flex';
      const lines = String(code || '').split('\n');
      const empty = { dataStructure: { type: 'trace', values: [], visited: [] }, activeIndices: [], variables: {}, callStack: [], loop: null };
      visSteps = lines.map((line, i) => {
        const trimmed = line.trim();
        let caption = 'Looking at this line.';
        if (/function\s|=>/.test(trimmed)) caption = 'This function is about to run.';
        else if (/^\s*if\b/.test(trimmed)) caption = 'Checking this condition.';
        else if (/^\s*(for|while)\b/.test(trimmed)) caption = 'Starting this loop.';
        else if (/return\b/.test(trimmed)) caption = 'About to return a value.';
        else if (!trimmed || trimmed.startsWith('//')) caption = 'Skipping a blank or comment line.';
        return {
          stepNumber: i,
          type: /return\b/.test(trimmed) ? 'return' : (/^\s*if\b/.test(trimmed) ? 'branch' : 'assign'),
          line: i + 1,
          caption,
          state: empty
        };
      }).filter(s => s.caption !== 'Skipping a blank or comment line.');
      if (visSteps.length === 0) {
        visSteps = [{ stepNumber: 0, type: 'call', line: 1, caption: 'Could not reach the story engine. Showing your code only.', state: empty }];
      }
      visCurrentIndex = 0;
      visDataStructure = 'trace';
      visIsCorrect = false;
      showVisualizerBanner('warning', 'Story engine is offline — playing a simple line walk instead.');
      visualizerPause();
      renderVisualizerStep(0, { speak: false });
      prefetchVisualizerVoiceAhead(0);
      visualizerPlay();
    }

    async function bootVisualizer(payload) {
      const userCode = (payload && payload.code) || '';
      const theater = document.getElementById('visualizer-theater');
      if (theater) theater.style.display = 'flex';
      populateVisualizerCode(userCode);

      const titleEl = document.getElementById('vis-problem-title');
      if (titleEl) titleEl.textContent = (payload && payload.problemTitle) || 'Story Visualizer';

      if (!userCode.trim()) {
        showVisualizerBanner('warning', 'Write or paste some code in the editor first.');
        const speechEl = document.getElementById('vis-caption-text');
        if (speechEl) speechEl.innerText = 'I need some code before I can tell the story.';
        return;
      }

      const speechEl = document.getElementById('vis-caption-text');
      if (speechEl) speechEl.innerText = 'Crafting the story of your code...';
      clearVisualizerBanner();

      try {
        const response = await fetch('/api/visualize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: userCode,
            language: (payload && payload.language) || 'javascript',
            problemTitle: (payload && payload.problemTitle) || '',
            problemType: (payload && payload.problemType) || '',
            testCases: (payload && payload.testCases) || []
          })
        });
        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); } catch (_) {
          throw new Error(raw.slice(0, 120) || 'Visualizer returned a non-JSON response');
        }

        populateVisualizerCode(userCode);

        if (!data.success && (data.errorType === 'syntax' || !data.steps || !data.steps.length)) {
          visSteps = [{
            stepNumber: 0,
            type: 'error',
            line: data.line || 1,
            caption: data.friendlyCaption || data.error || `There's a small typo somewhere — check line ${data.line || 1}.`,
            state: { variables: {}, dataStructure: { type: 'trace', values: [], visited: [] }, activeIndices: [], callStack: [], loop: null }
          }];
          visCurrentIndex = 0;
          visDataStructure = 'trace';
          visIsCorrect = false;
          showVisualizerBanner('error', visSteps[0].caption);
          visualizerPause();
          renderVisualizerStep(0);
          return;
        }

        if (data.steps && data.steps.length > 0) {
          visSteps = data.steps;
          visCurrentIndex = 0;
          visDataStructure = data.dsType || 'trace';
          visIsCorrect = Boolean(data.isCorrect);
          const dsBadge = document.getElementById('vis-ds-badge');
          if (dsBadge) dsBadge.innerText = String(visDataStructure).replace('-', ' ').toUpperCase();
          if (data.runtimeError) showVisualizerBanner('warning', data.runtimeError);
          else if (data.isInfiniteLoop) showVisualizerBanner('warning', "This looks like it might be looping forever — want to double check the loop's condition?");
          else if (visIsCorrect) showVisualizerBanner('success', "Nice work — that's correct! 🎉");
          else clearVisualizerBanner();
          visualizerPause();
          renderVisualizerStep(0, { speak: false });
          prefetchVisualizerVoiceAhead(0);
          visualizerPlay();
        } else {
          showVisualizerBanner('warning', 'I could not turn this into steps. Check the function and try again.');
          if (speechEl) speechEl.innerText = 'Nothing to play yet — the story came back empty.';
        }
      } catch (err) {
        console.warn('Visualizer boot failed:', err);
        runClientFallbackVisualizer(userCode);
      }
    }

    applySavedVisualizerTheme();
    applySavedVisualizerSpeed();
    applySavedVisualizerVoiceLang();
    syncVisualizerVoiceButton();
    syncVisualizerTransport();
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () {
        window.speechSynthesis.getVoices();
      };
    }
    document.addEventListener('pointerdown', unlockVisualizerAudio, true);

    (function start() {
      let payload = null;
      try { payload = JSON.parse(localStorage.getItem('hieroVisualizePayload') || sessionStorage.getItem('hieroVisualizePayload') || 'null'); } catch (_) {}
      const demo = new URLSearchParams(window.location.search).get('demo');
      if (demo === 'tree') {
        payload = {
          code: `class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def max_depth(root):
    if root is None:
        return 0
    left = max_depth(root.left)
    right = max_depth(root.right)
    return 1 + (left if left > right else right)

root = TreeNode(3, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))
print(max_depth(root))
`,
          language: 'python',
          problemTitle: 'Max Depth of Binary Tree'
        };
      } else if (demo === 'mergesort' || demo === 'merge-sort') {
        payload = {
          code: `def merge(left, right):
    merged = []
    i = 0
    j = 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            merged.append(left[i])
            i += 1
        else:
            merged.append(right[j])
            j += 1
    while i < len(left):
        merged.append(left[i])
        i += 1
    while j < len(right):
        merged.append(right[j])
        j += 1
    return merged

def merge_sort(nums):
    if nums is None:
        return []
    if len(nums) <= 1:
        return list(nums)
    mid = len(nums) // 2
    left = merge_sort(nums[:mid])
    right = merge_sort(nums[mid:])
    return merge(left, right)

print(merge_sort([38, 27, 43, 3, 9, 82, 10, 19, 50, 1, 62, 14, 7, 91, 4, 25]))
`,
          language: 'python',
          problemTitle: 'Merge Sort a Large Array',
          testCases: [{
            case: 1,
            name: '16-element visualization array',
            input: '[38, 27, 43, 3, 9, 82, 10, 19, 50, 1, 62, 14, 7, 91, 4, 25]',
            testCall: 'merge_sort([38, 27, 43, 3, 9, 82, 10, 19, 50, 1, 62, 14, 7, 91, 4, 25])',
            expectedOutput: '[1, 3, 4, 7, 9, 10, 14, 19, 25, 27, 38, 43, 50, 62, 82, 91]'
          }]
        };
      } else if (demo === 'graph') {
        payload = {
          code: `graph = {
    "A": ["B", "C"],
    "B": ["A", "D"],
    "C": ["A", "E"],
    "D": ["B"],
    "E": ["C"]
}
visited = []

def dfs(node):
    visited.append(node)
    for nxt in graph[node]:
        if nxt not in visited:
            dfs(nxt)

dfs("A")
print(visited)
`,
          language: 'python',
          problemTitle: 'DFS on a Graph'
        };
      } else if ((!payload || !payload.code) && (demo === 'truthy' || demo === 'evaluate_truthy')) {
        payload = {
          code: `def evaluate_truthy(val_list):
    truthy = sum(1 for x in val_list if bool(x))
    return {"truthy_count": truthy, "falsy_count": len(val_list) - truthy}`,
          language: 'python',
          problemTitle: 'Count Truthy and Falsy Elements',
          problemType: 'easy',
          testCases: [{
            case: 1,
            name: 'Mixed Values Test',
            input: "[0, 'Python', [], {}, 42, True]",
            testCall: "evaluate_truthy([0, 'Python', [], {}, 42, True])",
            expectedOutput: "{'truthy_count': 3, 'falsy_count': 3}"
          }]
        };
      }
      if (!payload || !payload.code) {
        const speechEl = document.getElementById('vis-caption-text');
        if (speechEl) speechEl.innerText = 'Open this from Visualize My Code on the solve page.';
        showVisualizerBanner('warning', 'No code was sent. Go back to the editor and click Visualize My Code.');
        return;
      }
      bootVisualizer(payload);
    })();

  </script>
