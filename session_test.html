<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">

<head>
  <meta charset="UTF-8">
  <title>Hiero Live AI Interview — Test Chamber</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo-hiero.png">

  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'bg-main': '#080a0f',
            'stage-bg': '#0f131a',
            'card-glass': 'rgba(18, 24, 38, 0.75)',
            'primary': '#07e219',
            'ai-purple': '#8b5cf6',
            'ai-purple-dark': '#6d28d9',
            'user-blue': '#38bdf8',
            'danger': '#ef4444'
          },
          fontFamily: {
            'sans': ['Plus Jakarta Sans', 'sans-serif'],
            'display': ['Outfit', 'sans-serif'],
            'mono': ['Geist Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg: #080a0f;
      --stage-bg: #0f131a;
      --ai-purple: #8b5cf6;
      --g: #07e219;
      --border: rgba(255, 255, 255, 0.08);
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.15), transparent 70%),
        radial-gradient(circle at 10% 90%, rgba(7, 226, 25, 0.06), transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.08), transparent 50%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Ambient pulse for AI Avatar */
    .ai-speaking-wave {
      animation: aiPulse 1.6s ease-in-out infinite alternate;
    }

    @keyframes aiPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.4), inset 0 0 15px rgba(139, 92, 246, 0.3);
      }
      100% {
        transform: scale(1.08);
        box-shadow: 0 0 70px rgba(139, 92, 246, 0.85), inset 0 0 30px rgba(139, 92, 246, 0.6);
      }
    }

    .ai-ripple-ring {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1.5px solid rgba(139, 92, 246, 0.35);
      animation: ringSpread 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }

    .ai-ripple-ring:nth-child(2) {
      inset: -32px;
      animation-delay: 1s;
    }

    .ai-ripple-ring:nth-child(3) {
      inset: -48px;
      animation-delay: 2s;
    }

    @keyframes ringSpread {
      0% { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    /* Soundwave Equalizer Bars */
    .eq-bar {
      width: 3px;
      border-radius: 4px;
      background: linear-gradient(to top, #8b5cf6, #c084fc);
      animation: eqBounce 1.2s ease-in-out infinite;
      height: 6px;
    }

    @keyframes eqBounce {
      0%, 100% { height: 6px; opacity: 0.4; }
      50% { height: 22px; opacity: 1; filter: drop-shadow(0 0 6px #8b5cf6); }
    }

    /* Custom Scrollbar for Transcript */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8b5cf6;
    }
  </style>
</head>

<body class="flex flex-col h-screen w-screen select-none">

  <!-- =========================================================
       TOP HEADER
       ========================================================= -->
  <header class="h-16 px-6 flex items-center justify-between border-b border-white/[0.06] bg-black/40 backdrop-blur-xl z-20 flex-shrink-0">

  <!-- =========================================================

  <main class="flex-1 flex overflow-hidden p-3 sm:p-5 gap-4 relative">
    
    <!-- Large Meeting Canvas Frame -->
    <div class="flex-1 flex flex-col items-center justify-between rounded-3xl bg-[#0d1117] border border-white/[0.08] relative overflow-hidden shadow-[0_20px_60px_rgba(0,0,0,0.8)] transition-all">

      <div class="absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(circle_at_50%_40%,rgba(139,92,246,0.18),transparent_65%)]"></div>

        <button onclick="confirmEndSession()" class="flex-1 py-2.5 rounded-xl bg-[#dc2626] hover:bg-[#b91c1c] text-xs font-bold text-white transition-colors shadow-lg shadow-red-600/30">

  <!-- =========================================================
       CLIENT-SIDE JAVASCRIPT & AI AUDIO ENGINE
       ========================================================= -->
  <script>
    // ─── STATE MANAGEMENT ────────────────────────────────────────────────────
    let sessionUserContext = {
      candidateName: "Rahul Chavan",
      roleTitle: "Product Manager",
      company: "Google",
      duration: 15
    };

    // Load from sessionStorage if available
    try {
      const savedCtx = sessionStorage.getItem('mockContext') || localStorage.getItem('hiero_mock_context');
      if (savedCtx) {
        sessionUserContext = Object.assign(sessionUserContext, JSON.parse(savedCtx));
      }
    } catch(e){}

    const candidateInitials = (sessionUserContext.candidateName || 'RC')
      .split(' ')
      .map(w => w[0])
      .join('')
      .substring(0, 2)
      .toUpperCase();

    document.getElementById('header-role-title').textContent = sessionUserContext.roleTitle;
    document.getElementById('candidate-avatar-initial').textContent = candidateInitials || 'RC';

    let conversationHistory = [];
    let isUserMuted = false;
    let isAISpeaking = false;
    let currentTurn = 1;
    const TOTAL_TURNS = 5;
    let sessionDurationSec = (sessionUserContext.duration || 15) * 60;
    let sessionTimerInterval = null;

    let mediaStream = null;
    let speechRecognition = null;
    let candidateAccumulatedText = "";
    let audioRecorder = null;
    let audioChunks = [];
    let currentAiAudio = null;

    // ─── UI TOGGLES ─────────────────────────────────────────────────────────
    function toggleTranscriptDrawer() {
      const drawer = document.getElementById('transcript-drawer');
      const btn = document.getElementById('btn-toggle-transcript');
      if (drawer.style.display === 'none') {
        drawer.style.display = 'flex';
        btn.classList.add('bg-[#8b5cf6]/30', 'text-purple-300', 'border-[#8b5cf6]/50');
      } else {
        drawer.style.display = 'none';
        btn.classList.remove('bg-[#8b5cf6]/30', 'text-purple-300', 'border-[#8b5cf6]/50');
      }
    }

    function openEndInterviewModal() {
      document.getElementById('end-interview-modal').style.display = 'flex';
    }

    function closeEndInterviewModal() {
      document.getElementById('end-interview-modal').style.display = 'none';
    }

    function confirmEndSession() {
      closeEndInterviewModal();
      if (speechRecognition) { try { speechRecognition.stop(); } catch(e){} }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); }
      if (currentAiAudio) { try { currentAiAudio.pause(); } catch(e){} }
      
      document.getElementById('live-subtitle-text').textContent = "Interview session completed. Thank you!";
      alert("Session completed! In this standalone test page, the session has concluded.");
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatCleanTranscript(text) {
      if (!text) return '';
      let clean = String(text);
      
      // Clean leading and trailing backticks
      clean = clean.replace(/^```[a-z]*\n?/gi, '').replace(/\n?```$/g, '');
      
      // Clean markdown bold tags like **Scenario:** or **Option A:**
      clean = clean.replace(/\*\*\s*Option\s*([A-D])\s*:\s*\*\*/gi, 'Option $1:');
      clean = clean.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      clean = clean.replace(/\*(.*?)\*/g, '<em>$1</em>');
      
      // Clean redundant markdown dashes/bullets
      clean = clean.replace(/^[•\-*]\s+/gm, '');
      
      // Convert line breaks
      clean = clean.replace(/\n\n+/g, '<br/><br/>').replace(/\n/g, '<br/>');

      // Style Option A, Option B, Option C, Option D or a), b), c), d)
      clean = clean.replace(/(Option\s+[A-D][:.]?|\b[a-d]\)\s+)/gi, '<span class="inline-block px-2 py-0.5 my-0.5 rounded bg-[#8b5cf6]/20 text-purple-300 font-mono font-bold border border-[#8b5cf6]/35">$1</span> ');

      // Highlight the concluding question prompt
      clean = clean.replace(/(Which option would you choose[^<]*\?|Please choose one option[^<]*\?|Please explain your technical reasoning[^<]*\.?)/gi, '<span class="text-purple-200 font-bold block mt-2 pt-1 border-t border-white/10">$1</span>');

      return clean;
    }

    function appendTranscriptMessage(role, text) {
      const feed = document.getElementById('transcript-feed');
      if (!feed) return;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'flex items-start gap-2.5 animate-in fade-in duration-300';

      if (role === 'assistant') {
        bubbleDiv.innerHTML = `
          <div class="w-6 h-6 rounded-full bg-[#8b5cf6] text-white flex items-center justify-center font-bold text-[10px] flex-shrink-0 mt-0.5">
            I
          </div>
          <div class="flex-1 bg-white/[0.04] p-3 rounded-2xl rounded-tl-sm border border-white/[0.06] text-slate-200 leading-relaxed">
            ${formatCleanTranscript(text)}
          </div>
        `;
      } else {
        bubbleDiv.innerHTML = `
          <div class="w-6 h-6 rounded-full bg-[#0284c7] text-white flex items-center justify-center font-bold text-[10px] flex-shrink-0 mt-0.5">
            ${candidateInitials || 'R'}
          </div>
          <div class="flex-1 bg-sky-500/10 p-3 rounded-2xl rounded-tl-sm border border-sky-500/20 text-sky-100 leading-relaxed font-medium">
            "${escapeHtml(text)}"
          </div>
        `;
      }

      feed.appendChild(bubbleDiv);
      feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });
    }

    // ─── CAMERA & MICROPHONE STREAM ──────────────────────────────────────────
    async function initCameraAndMic() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });

        const pipVideo = document.getElementById('candidate-pip-video');
        if (pipVideo) {
          pipVideo.srcObject = mediaStream;
        }

        initSpeechRecognition();
      } catch (err) {
        console.warn("Camera/Mic initialization warning:", err);
        const fallback = document.getElementById('pip-cam-fallback');
        if (fallback) fallback.style.display = 'flex';
      }
    }

    function toggleCandidateMic() {
      if (isUserMuted) {
        // Unmute
        isUserMuted = false;
        const pipIcon = document.getElementById('pip-mic-icon');
        if (pipIcon) {
          pipIcon.className = "text-primary text-[10px] cursor-pointer hover:scale-110 transition-transform";
          pipIcon.innerHTML = '<i class="fa-solid fa-microphone"></i>';
        }
        try { speechRecognition?.start(); } catch(e){}
      } else {
        // Mute
        isUserMuted = true;
        const pipIcon = document.getElementById('pip-mic-icon');
        if (pipIcon) {
          pipIcon.className = "text-red-400 text-[10px] cursor-pointer hover:scale-110 transition-transform";
          pipIcon.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
        }
        try { speechRecognition?.stop(); } catch(e){}
      }
    }

    // ─── SPEECH RECOGNITION & AUTO-TURN STREAM ────────────────────────────────
    let autoSubmitSilenceTimer = null;

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      try {
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;
        speechRecognition.lang = 'en-US';

        speechRecognition.onresult = (event) => {
          let interimText = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              candidateAccumulatedText += ' ' + transcript;
            } else {
              interimText += transcript;
            }
          }

          if (autoSubmitSilenceTimer) clearTimeout(autoSubmitSilenceTimer);
          const fullSpoken = (candidateAccumulatedText + ' ' + interimText).trim();

          // If user spoken answer reaches a sentence and pauses for 1.8s, automatically submit turn
          if (fullSpoken.length > 5 && !isAISpeaking && !isUserMuted) {
            autoSubmitSilenceTimer = setTimeout(() => {
              submitCandidateTurn(fullSpoken);
            }, 1800);
          }
        };

        speechRecognition.onend = () => {
          if (!isUserMuted && !isAISpeaking) {
            setTimeout(() => { try { speechRecognition.start(); } catch(e){} }, 200);
          }
        };

        if (!isUserMuted) {
          try { speechRecognition.start(); } catch(e){}
        }
      } catch (e) {
        console.warn("Speech recognition notice:", e);
      }
    }

    // ─── TEXT TO SPEECH (Deepgram Neural Voice) ──────────────────────────────
    async function playAIVoice(text, audioUrl = null) {
      isAISpeaking = true;
      const orb = document.getElementById('ai-main-orb');
      const eq = document.getElementById('ai-equalizer');

      if (orb) orb.classList.add('ai-speaking-wave');
      if (eq) eq.style.display = 'flex';

      const onDone = () => {
        isAISpeaking = false;
        if (orb) orb.classList.remove('ai-speaking-wave');
        if (!isUserMuted) {
          try { speechRecognition?.start(); } catch(e){}
        }
      };

      let targetAudioUrl = audioUrl;

      if (!targetAudioUrl && text && text.length > 5) {
        try {
          const ttsRes = await fetch('/api/interview/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          const ttsData = await ttsRes.json();
          if (ttsData.success && ttsData.audio_url) {
            targetAudioUrl = ttsData.audio_url;
          }
        } catch(e) {}
      }

      if (targetAudioUrl) {
        try {
          if (currentAiAudio) { try { currentAiAudio.pause(); } catch(e){} }
          currentAiAudio = new Audio(targetAudioUrl);
          currentAiAudio.onended = onDone;
          currentAiAudio.onerror = () => fallbackWebSpeech(text, onDone);
          currentAiAudio.play().catch(() => fallbackWebSpeech(text, onDone));
          return;
        } catch(e) {}
      }

      fallbackWebSpeech(text, onDone);
    }

    function fallbackWebSpeech(text, onDone) {
      if (!window.speechSynthesis) { if (onDone) onDone(); return; }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.0;
      utter.pitch = 1.0;
      utter.onend = onDone;
      utter.onerror = onDone;
      window.speechSynthesis.speak(utter);
    }

    // ─── START INTERVIEW & LOAD QUESTION ─────────────────────────────────────
    async function startInterviewFlow() {
      startTimer();

      try {
        const res = await fetch('/api/interview/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            context: sessionUserContext,
            sessionId: 'test-sess-' + Date.now()
          })
        });
        const data = await res.json();
        const greeting = data.reply || `Hello ${sessionUserContext.candidateName}, and welcome to your ${sessionUserContext.roleTitle} interview. To begin, could you introduce yourself?`;
        
        conversationHistory.push({ role: 'assistant', content: greeting });
        document.getElementById('first-ai-bubble').innerHTML = formatCleanTranscript(greeting);
        playAIVoice(greeting, data.audio_url);
      } catch (err) {
        const fallback = `Hello ${sessionUserContext.candidateName}, and welcome to your ${sessionUserContext.roleTitle} interview. To begin, please introduce yourself.`;
        conversationHistory.push({ role: 'assistant', content: fallback });
        document.getElementById('first-ai-bubble').innerHTML = formatCleanTranscript(fallback);
        playAIVoice(fallback);
      }
    }

    async function submitCandidateTurn(spokenText) {
      const candidateAnswer = spokenText || candidateAccumulatedText.trim();
      if (!candidateAnswer || isAISpeaking) return;

      candidateAccumulatedText = "";
      appendTranscriptMessage('user', candidateAnswer);
      conversationHistory.push({ role: 'user', content: candidateAnswer });

      currentTurn++;
      const turnBadge = document.getElementById('turn-count-badge');
      if (turnBadge) turnBadge.textContent = `Turn ${currentTurn}`;

      try {
        const response = await fetch('/api/interview/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: 'test-sess-direct',
            context: sessionUserContext,
            messages: conversationHistory
          })
        });
        const data = await response.json();
        const reply = data.reply || "Thank you for explaining your reasoning. Let's move to the next technical scenario.";

        conversationHistory.push({ role: 'assistant', content: reply });
        appendTranscriptMessage('assistant', reply);
        playAIVoice(reply, data.audio_url);
      } catch (err) {
        console.error("Chat error:", err);
        const fallback = "Great reasoning. Let's proceed to the next system architecture challenge.";
        conversationHistory.push({ role: 'assistant', content: fallback });
        appendTranscriptMessage('assistant', fallback);
        playAIVoice(fallback);
      }
    }

    // Allow pressing Enter key to submit candidate speech or manually type
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isAISpeaking) {
        const promptInput = prompt("Your answer:", candidateAccumulatedText || "I choose Option A.");
        if (promptInput) submitCandidateTurn(promptInput);
      }
    });


    function startTimer() {
      if (sessionTimerInterval) clearInterval(sessionTimerInterval);
      sessionTimerInterval = setInterval(() => {
        if (sessionDurationSec <= 0) {
          clearInterval(sessionTimerInterval);
          return;
        }
        sessionDurationSec--;
        const m = Math.floor(sessionDurationSec / 60).toString().padStart(2, '0');
        const s = (sessionDurationSec % 60).toString().padStart(2, '0');
        const display = document.getElementById('session-timer-display');
        if (display) display.textContent = `00:${m}:${s}`;
      }, 1000);
    }

    // ─── INITIALIZATION ──────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
      await initCameraAndMic();
      setTimeout(startInterviewFlow, 500);
    });
  </script>
