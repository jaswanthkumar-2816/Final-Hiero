<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Hiero theme base: one source for colour and type, served by routes/theme.js.
       Must stay first and must NOT be deferred, or dark-mode users see a white
       flash before the engine resolves their choice. -->
  <link rel="stylesheet" href="/theme/hiero.css">
  <script src="/theme/hiero.js"></script>
<title>Hiero - Select Role</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="/auth-session.js"></script>
</head>
<body>
  <div class="screen">
    <div class="card">
      <h2>Select Your Role</h2>
      <button id="student-btn" class="role-btn">Login as Student</button>
      <button id="job-seeker-btn" class="role-btn">Login as Job Seeker</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
